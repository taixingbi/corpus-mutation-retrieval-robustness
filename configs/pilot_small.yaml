# 50-seed pilot on the full Wikipedia chunk corpus + real dense models.
# Shares data/runs/pilot/0_base with the full pilot config.
run_id: pilot_small
base_dir: data/runs/pilot/0_base
output_dir: data/runs/pilot_small

failures:
  - missing
  - hard_negative
  - conflict
  - boundary
  - noise

construction_retrievers:
  - bm25
  - bge_base
  - hybrid

held_out_retrievers:
  - e5_large
  - gte_large

dense_models:
  bge_base: BAAI/bge-base-en-v1.5
  e5_large: intfloat/e5-large-v2
  gte_large: thenlper/gte-large

rrf_k: 60
top_k: 20
rerank_top_n: 5

chat:
  model: openai.gpt-oss-120b-1:0
  temperature: 0
  max_tokens: 1024
  judge_max_tokens: 1024

rerankers:
  - cross-encoder/ms-marco-MiniLM-L6-v2
  - jinaai/jina-reranker-v2-base-multilingual
  - mixedbread-ai/mxbai-rerank-large-v1
  - BAAI/bge-reranker-v2-m3

noise_add_count: 5
behavioral_majority: 2
seed_limit: 50
llm_concurrency: 8
# 1 = encode one dense model at a time (safer on MPS)
embed_concurrency: 1
embed_batch_size: 128
# null = auto (cuda > mps > cpu)
embed_device: null
# 1 = serialize ECS /v1/rerank (avoids ALB 502 stampede)
rerank_concurrency: 1
http_retries: 5
rerank_pool_size: 20
mutation_oversample:
  missing: 1
  hard_negative: 1
  conflict: 1
  boundary: 1
  noise: 1
rq4_target_recoverable: 150
bootstrap_n: 1000
bootstrap_seed: 0
