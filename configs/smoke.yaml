# Local smoke (MiniLM stand-ins)
run_id: smoke
base_dir: data/runs/smoke/0_base
output_dir: data/runs/smoke

failures:
  - missing
  - hard_negative
  - conflict
  - boundary
  - noise

construction_retrievers:
  - bm25
  - bge_base
  - hybrid

held_out_retrievers:
  - e5_large
  - gte_large

dense_models:
  bge_base: sentence-transformers/all-MiniLM-L6-v2
  e5_large: sentence-transformers/all-MiniLM-L6-v2
  gte_large: sentence-transformers/all-MiniLM-L6-v2

rrf_k: 60
top_k: 20

chat:
  model: openai.gpt-oss-120b-1:0
  temperature: 0
  max_tokens: 1024
  judge_max_tokens: 1024

noise_add_count: 3
behavioral_majority: 2
seed_limit: null
llm_concurrency: 4
embed_concurrency: 1
embed_batch_size: 64
embed_device: null
http_retries: 3

mutation_oversample:
  missing: 1
  hard_negative: 1
  conflict: 1
  boundary: 1
  noise: 1
